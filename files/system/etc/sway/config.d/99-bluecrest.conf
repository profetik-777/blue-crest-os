# Additional conveniences; keep Fedora's session, media keys and lock handling.
bindsym $mod+comma exec bluecrest-settings
bindsym $mod+F1 exec bluecrest-shortcuts
bindsym $mod+Shift+v exec bluecrest-clipboard
bindsym $mod+Shift+x exec loginctl lock-session
bindsym $mod+Shift+p exec waypaper --backend swaybg
bindsym $mod+Shift+Return exec pcmanfm-qt

input type:touchpad {
    tap enabled
    dwt enabled
}
for_window [app_id="^(waypaper|nwg-displays|nwg-look|nm-connection-editor)$"] floating enable
# nwg-displays writes these files; it can reload Sway after saving.
include ~/.config/sway/outputs
include ~/.config/sway/workspaces
# Restore after reload as Fedora's main config sets a default background.
exec_always bluecrest-wallpaper
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
# Kanshi is available for optional docking profiles, but is not auto-started:
# it must not compete with nwg-displays for monitor layout.
