---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Keep the uBlue base; Fedora Sway packages supply the desktop.
# Pin Fedora 44 to match the verified community package repositories.
name: blue-crest-os
description: Blue Crest OS - an opinionated Sway experience with user-friendly keybindings
base-image: ghcr.io/ublue-os/base-main
image-version: '44'
modules:
- type: dnf
  install:
    packages:
    - sway
    - sway-config-fedora
    - sway-systemd
    - sddm-wayland-sway
    - foot
    - terminator
    - kitty
    - rofi-wayland
    - waybar
    - swaybg
    - python3
    - swayidle
    - swaylock
    - mako
    - lxqt-policykit
    # Screen mirroring / Immersed prerequisites for Sway.
    - xdg-desktop-portal
    - xdg-desktop-portal-wlr
    - xdg-desktop-portal-gtk
    - gnome-keyring
    - pipewire
    - pipewire-pulseaudio
    - wireplumber
    - libva
    - libva-utils
    - pavucontrol
    - brightnessctl
    - playerctl
    - grim
    - slurp
    - grimshot
    - wl-clipboard
    - cliphist
    - libnotify
    - dejavu-sans-fonts
    - qt6-qtwayland
    - xorg-x11-server-Xwayland
    - kanshi
    - pcmanfm-qt
    - lxqt-archiver
    - sddm
    - sddm-themes
    - network-manager-applet
    - nm-connection-editor
    - firewall-config
    - xdg-user-dirs
    - upower
    - podman
    - distrobox
    - geany
    - geany-themes
    - geany-plugins-addons
    - gnome-boxes
    - gnome-disk-utility
    - virt-manager
    - filezilla
    - tmux
    - tailscale
    - waydroid
    - waydroid-selinux
    - fedora-workstation-backgrounds
    - f40-backgrounds
    - f41-backgrounds
    - f42-backgrounds
    - papirus-icon-theme
    - adwaita-icon-theme
    - breeze-icon-theme
    - breeze-cursor-theme
  remove:
    packages:
    - firefox
    - firefox-langpacks
    - gnome-connections
    - gnome-calendar
    - simple-scan
    - evince
    - pinta
    - gnome-calculator
    - gnome-contacts
    - snapshot
    - gnome-maps
    - gnome-sound-recorder
    - smile
    - gnome-weather
- type: dnf
  repos:
    files:
    - bluecrest-nwg.repo
    cleanup: true
  install:
    packages:
    - repo: bluecrest-nwg
      packages:
      - nwg-displays
      - nwg-look
# Common Bluefin DX developer tools; keep the existing Sway base.
# Reference: ublue-os/bluefin build_files/dx/00-dx.sh
- type: dnf
  install:
    packages:
    - android-tools
    - bcc
    - bpftop
    - bpftrace
    - cascadia-code-fonts
    - cockpit-bridge
    - cockpit-machines
    - cockpit-networkmanager
    - cockpit-ostree
    - cockpit-podman
    - cockpit-selinux
    - cockpit-storaged
    - cockpit-system
    - dbus-x11
    - edk2-ovmf
    - flatpak-builder
    - genisoimage
    - git-subtree
    - git-svn
    - iotop
    - libcgroup
    - libvirt
    - libvirt-nss
    - nicstat
    - numactl
    - osbuild-selinux
    - p7zip
    - p7zip-plugins
    - podman-compose
    - podman-machine
    - podman-tui
    - qemu
    - qemu-char-spice
    - qemu-device-display-virtio-gpu
    - qemu-device-display-virtio-vga
    - qemu-device-usb-redirect
    - qemu-img
    - qemu-system-x86-core
    - qemu-user-binfmt
    - qemu-user-static
    - sysprof
    - incus
    - incus-agent
    - lxc
    - tiptop
    - trace-cmd
    - udica
    - util-linux-script
    - virt-v2v
    - virt-viewer
    - wtype
    - ydotool
# Docker's official Fedora repository supplies Engine, Buildx and Compose v2.
- type: dnf
  repos:
    files:
    - https://download.docker.com/linux/fedora/docker-ce.repo
    cleanup: true
  install:
    packages:
    - repo: docker-ce-stable
      packages:
      - containerd.io
      - docker-ce
      - docker-ce-cli
      - docker-buildx-plugin
      - docker-compose-plugin
# Use Microsoft's signed RPM repository, as in Bluefin DX.
- type: script
  snippets:
  - |
    set -eu
    cat > /etc/yum.repos.d/bluecrest-vscode.repo <<'EOF'
    [bluecrest-code]
    name=Visual Studio Code
    baseurl=https://packages.microsoft.com/yumrepos/vscode
    enabled=0
    gpgcheck=1
    gpgkey=https://packages.microsoft.com/keys/microsoft.asc
    EOF
    dnf5 -y --enable-repo=bluecrest-code install code
    rm /etc/yum.repos.d/bluecrest-vscode.repo
  - |
    set -eu
    for tool in podman podman-compose docker code virsh incus; do
      command -v "$tool"
    done
    docker compose version
    docker buildx version
    podman-compose --version
- type: files
  files:
  - source: system
    destination: /
- type: script
  scripts:
  - configure-sway.sh
- type: systemd
  system:
    enabled:
    - sddm.service
    - tailscaled.service
    - docker.socket
    - podman.socket
- type: default-flatpaks
  configurations:
  - notify: true
    scope: system
    install:
    - org.mozilla.firefox
    - org.ksnip.ksnip
    - io.github.kolunmi.Bazaar
    - com.ranfdev.DistroShelf
    - com.github.tchx84.Flatseal
    - io.gitlab.adhami3310.Impression
    - org.remmina.Remmina
    - com.google.AndroidStudio
    - io.podman_desktop.PodmanDesktop
  - scope: user
- type: brew
  nofile-limits: true
- type: signing
